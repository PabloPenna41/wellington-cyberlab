[Interface]
# Endereço virtual privado da estação de testes Windows dentro do laboratório
Address = 10.77.0.2/24
# DNS interno ou público seguro
DNS = 1.1.1.1, 1.0.0.1
# A chave privada do cliente será preenchida durante a inicialização do túnel
# PrivateKey = <CLIENT_PRIVATE_KEY>

[Peer]
# Chave pública do servidor CachyOS (Wellington CyberLab Server)
# PublicKey = <SERVER_PUBLIC_KEY>
# IP público ou IP local do servidor e porta UDP do WireGuard
Endpoint = 192.168.1.6:51820
# Roteamento restrito: Apenas a sub-rede do laboratório passa pelo túnel
AllowedIPs = 10.77.0.0/24, 192.168.1.6/32
# Manter túnel ativo através de NAT ou firewall a cada 25 segundos
PersistentKeepalive = 25
