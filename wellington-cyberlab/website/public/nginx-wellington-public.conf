# Configuração Nginx: Wellington Negócios (Ambiente Institucional Público)
# Arquivo: wellington-cyberlab/website/public/nginx-wellington-public.conf

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 192.168.1.6;

    # Raiz dos arquivos estáticos institucionais (copiado via setup_phase1.sh)
    root /srv/http/wellington-cyberlab/public;
    index index.html;

    # Cabeçalhos básicos de segurança (Hardening inicial)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Roteamento padrão
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desabilitar logs para favicon e robots se não existirem
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Logs dedicados ao laboratório
    access_log /var/log/nginx/wellington_access.log;
    error_log /var/log/nginx/wellington_error.log;
}
